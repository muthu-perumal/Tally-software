[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--include=dev"
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "DATABASE_URL,TALLY_COMPANY,TALLY_URL,TALLY_CONNECTION_MODE,APP_NAME,COMPANY_NAME,JWT_SECRET,TALLY_BRIDGE_API_KEY"

[functions]
  node_bundler = "esbuild"
  included_files = ["server/**"]

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
